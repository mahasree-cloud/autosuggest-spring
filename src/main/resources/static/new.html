<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Skill Exchange Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#eef5ff;
}
.hero{
    background:#0d6efd;
    color:white;
    padding:40px;
    text-align:center;
}
.card{
    transition:.3s;
}
.card:hover{
    transform:scale(1.03);
}
footer{
    background:#0d6efd;
    color:white;
    padding:15px;
    margin-top:30px;
    text-align:center;
}
</style>

</head>
<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">
<h3 class="text-white">🎓 Student Skill Exchange Hub</h3>
</div>
</nav>

<div class="hero">
<h1>Learn • Teach • Grow</h1>
<p>Exchange skills with fellow students.</p>
</div>

<div class="container mt-4">

<div class="row mb-3">

<div class="col-md-4">
<input type="text" id="name" class="form-control" placeholder="Student Name">
</div>

<div class="col-md-4">
<input type="text" id="skill" class="form-control" placeholder="Skill">
</div>

<div class="col-md-4">
<button class="btn btn-success w-100" onclick="addSkill()">Add Skill</button>
</div>

</div>

<input type="text" id="search" class="form-control mb-4" placeholder="Search Skills..." onkeyup="showSkills()">

<div class="row" id="output"></div>

</div>

<footer>
Created by Student Skill Exchange Hub
</footer>

<script>

let skills=[
{name:"Alice",skill:"Python"},
{name:"Rahul",skill:"Web Development"},
{name:"Priya",skill:"Graphic Design"},
{name:"Sneha",skill:"Dance"},
{name:"Akash",skill:"Data Science"}
];

function showSkills(){

let search=document.getElementById("search").value.toLowerCase();

let text="";

skills.forEach(function(s){

if(
s.name.toLowerCase().includes(search) ||
s.skill.toLowerCase().includes(search)
){

text+=`

<div class="col-md-4 mb-3">

<div class="card shadow">

<div class="card-body">

<h4>${s.name}</h4>

<p><b>Skill:</b> ${s.skill}</p>

<button class="btn btn-primary w-100"
onclick="requestSkill('${s.name}')">

Request to Learn

</button>

</div>

</div>

</div>

`;

}

});

document.getElementById("output").innerHTML=text;

}

function addSkill(){

let n=document.getElementById("name").value;
let s=document.getElementById("skill").value;

if(n==""||s==""){
alert("Please fill all fields");
return;
}

skills.push({
name:n,
skill:s
});

document.getElementById("name").value="";
document.getElementById("skill").value="";

showSkills();

}

function requestSkill(name){

alert("Request sent to "+name+"!");

}

showSkills();

</script>

</body>
</html>
