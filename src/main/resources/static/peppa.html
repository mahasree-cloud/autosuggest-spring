<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Pig Family</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(#87CEEB,#B0E0E6);
}

.navbar{
    background:#ff69b4;
}

.hero{
    text-align:center;
    padding:50px;
    background:#98FB98;
}

.hero h1{
    color:#d63384;
    font-weight:bold;
}

.card{
    border-radius:15px;
    transition:.3s;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
}

.card:hover{
    transform:scale(1.05);
}

.emoji{
    font-size:80px;
}

footer{
    background:#ff69b4;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

.dark{
    background:#222;
    color:white;
}

.dark .hero{
    background:#444;
}

.dark .card{
    background:#333;
    color:white;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand text-white fw-bold" href="#">
🐷 Happy Pig Family
</a>
</div>
</nav>

<div class="hero">
<h1>Welcome to Happy Pig Family!</h1>
<p>Fun • Family • Adventure</p>

<button class="btn btn-warning" onclick="helloPig()">
Say Hello 👋
</button>

<button class="btn btn-dark" onclick="darkMode()">
Dark Mode 🌙
</button>
</div>

<div class="container mt-5">

<div class="row">

<div class="col-md-4 mb-4">

<div class="card text-center p-3">

<div class="emoji">🐷</div>

<h3>Pinky Pig</h3>

<p>I love muddy puddles!</p>

<button class="btn btn-primary" onclick="like('Pinky Pig')">
❤️ Like
</button>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card text-center p-3">

<div class="emoji">🐽</div>

<h3>Baby Pig</h3>

<p>I love dinosaurs!</p>

<button class="btn btn-success" onclick="like('Baby Pig')">
❤️ Like
</button>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card text-center p-3">

<div class="emoji">🐖</div>

<h3>Papa Pig</h3>

<p>Let's go on an adventure!</p>

<button class="btn btn-danger" onclick="family()">
Meet Family
</button>

</div>

</div>

</div>

<div class="text-center">

<h3 id="quote">
Click the button below!
</h3>

<button class="btn btn-info" onclick="randomQuote()">
🎲 Random Quote
</button>

</div>

</div>

<footer>

Made with ❤️ using HTML • CSS • JavaScript • Bootstrap

</footer>

<script>

function helloPig(){
alert("Oink Oink! Welcome to Happy Pig Family!");
}

function like(name){
alert("You liked " + name + " ❤️");
}

function family(){
alert("Welcome to the Happy Pig Family!");
}

function darkMode(){
document.body.classList.toggle("dark");
}

let quotes=[
"Jump in muddy puddles! 🌧️",
"Friendship is fun! 😊",
"Adventure awaits! 🚀",
"Family makes everything better! ❤️",
"Smile every day! 🌈"
];

function randomQuote(){

let random=Math.floor(Math.random()*quotes.length);

document.getElementById("quote").innerHTML=quotes[random];

}

</script>

</body>
</html>
